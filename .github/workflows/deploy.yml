name: Deploy to Netlify

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Netlify token
        id: check
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          if [ -n "$NETLIFY_AUTH_TOKEN" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::warning::未配置 NETLIFY_AUTH_TOKEN 密钥，本次跳过部署。可在 Netlify 后台创建 Token 后执行：gh secret set NETLIFY_AUTH_TOKEN --body \"<token>\" -R wqz93/jiugong-pingtai"
          fi

      - name: Deploy to Netlify
        if: steps.check.outputs.has_token == 'true'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          SITE_ID: 9d4db5a9-7c14-44fd-8bd0-6f18284848c7
        run: |
          npx --yes netlify-cli@27 deploy \
            --dir=. \
            --prod \
            --site="$SITE_ID" \
            --auth="$NETLIFY_AUTH_TOKEN" \
            --message "deploy: ${GITHUB_SHA::8}"

      - name: Summary
        run: echo "站点地址：https://sng-jiugong-pingtai.netlify.app"
